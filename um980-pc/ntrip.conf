# Configuration NTRIP pour le Rover UM980
# Réseau par défaut : Centipede RTK (libre d'accès en France / transfrontalier)

[ntrip]
# Activer NTRIP par défaut lors du lancement du script (true/false)
# Si 'false' : utilisez l'argument --ntrip pour l'activer à la demande
enabled = false

# Adresse et port du Caster
server = caster.centipede.fr
port = 2101

# Point de montage (Mountpoint)
# Exemples de stations :
#   - 'NEAR' : Sélection automatique par le Caster de la base la plus proche (défaut)
#   - 'CLOU' : Base fixe d'Évian-les-Bains
#   - 'JBCH' : Base d'Annemasse (~28.6 km)
#   - 'MRON' : Base Gros Morond (~27.0 km)
mountpoint = NEAR

# Identifiants Centipede (gratuits / libres)
user = centipede
password = centipede

# Intervalle d'envoi de la position GGA du rover au Caster (en secondes)
gga_interval = 10
